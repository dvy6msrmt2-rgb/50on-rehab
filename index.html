<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>50音チップ単語作成ツール - リハビリテーション用</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* リハビリ・タッチ操作向けユニバーサル設定 */
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      color: #1e293b;
      overscroll-behavior: none;
    }

    /* 3D立体感のある文字チップ */
    .tile-btn {
      transition: all 0.08s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12), 0 2px 4px rgba(0, 0, 0, 0.08);
      position: relative;
    }
    .tile-btn:active, .tile-btn.is-pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    /* 解答スロット用タイル */
    .slot-tile {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .slot-tile:hover {
      transform: translateY(-2px);
    }
    .slot-tile.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    /* ドラッグ追従用ゴースト要素 */
    #drag-ghost {
      pointer-events: none;
      position: fixed;
      z-index: 9999;
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 12px 24px rgba(0,0,0,0.25);
      display: none;
      opacity: 0.9;
    }

    /* 伝統的50音表（右からあ行）用のRTL風グリッドコンテナ */
    .gojuon-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      direction: rtl; /* 右から左へ列を配置 */
    }
    .gojuon-grid > * {
      direction: ltr; /* 文字自体は正方向 */
    }

    /* カスタムスクロールバー */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-slate-100 text-slate-800">

  <!-- ヘッダーバー -->
  <header class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shrink-0 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-sky-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-wide text-slate-800 flex items-center gap-2">
          50音チップ単語作成アプリ
          <span class="text-xs px-2 py-0.5 bg-sky-100 text-sky-700 font-semibold rounded-full border border-sky-200">リハビリ用</span>
        </h1>
        <p class="text-xs text-slate-500 hidden sm:block">文字チップをタップまたはドラッグして、ことばをつくりましょう</p>
      </div>
    </div>

    <!-- コントロールボタン群（設定） -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- 音効切替 -->
      <button id="btn-sound-toggle" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-semibold transition active:scale-95 shadow-sm">
        <svg id="icon-sound-on" class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        </svg>
        <svg id="icon-sound-off" class="w-5 h-5 text-slate-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
        <span class="hidden md:inline">操作音</span>
      </button>

      <!-- 文字サイズ変更 -->
      <button id="btn-font-size" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-semibold transition active:scale-95 shadow-sm">
        <span class="text-xs font-bold">A</span><span class="text-base font-bold">A</span>
        <span id="label-font-size" class="hidden md:inline">文字:大</span>
      </button>

      <!-- 記録パネルトグル -->
      <button id="btn-toggle-history" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-semibold transition active:scale-95 shadow-sm relative">
        <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="hidden md:inline">記録メモ</span>
        <span id="history-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-white hidden">0</span>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- 左側 / 中央：単語作成エリアと50音ボード -->
    <main class="flex-1 flex flex-col overflow-hidden p-2 sm:p-3 gap-2 sm:gap-3">
      
      <!-- 1. 単語表示・作成エリア（解答スロット） -->
      <section class="bg-white rounded-2xl p-2.5 sm:p-3 shadow-md border-2 border-sky-100 flex flex-col gap-2 shrink-0">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-sky-800 uppercase tracking-wider flex items-center gap-1">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-500 inline-block"></span>
            作成した単語
          </span>
          <span id="word-count-label" class="text-xs font-semibold text-slate-500">0 文字</span>
        </div>

        <!-- 文字が並ぶドロップターゲットコンテナ -->
        <div id="word-slot-container" class="min-h-[80px] sm:min-h-[96px] w-full bg-slate-50 rounded-xl border-2 border-dashed border-slate-300 p-2 flex items-center flex-wrap gap-2 transition-colors duration-200 overflow-x-auto relative">
          <div id="slot-placeholder" class="absolute inset-0 flex items-center justify-center text-slate-400 pointer-events-none text-xs sm:text-sm font-medium">
            50音チップを押すか、ここまで引っ張ってください
          </div>
        </div>

        <!-- 解答欄コントロールボタン -->
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <div class="flex items-center gap-2">
            <!-- 音声読み上げボタン -->
            <button id="btn-speak" class="flex items-center gap-1.5 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm shadow-sm active:translate-y-0.5 transition">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
              </svg>
              よみあげる
            </button>
            
            <!-- 記録（決定）ボタン -->
            <button id="btn-save-word" class="flex items-center gap-1.5 px-3.5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-bold text-sm shadow-sm active:translate-y-0.5 transition">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              きろくする
            </button>
          </div>

          <div class="flex items-center gap-2">
            <!-- 1文字消す -->
            <button id="btn-backspace" class="flex items-center gap-1 px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold text-xs sm:text-sm shadow-sm active:translate-y-0.5 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414a2 2 0 011.414-.586H19a2 2 0 012 2v12a2 2 0 01-2 2H10.828a2 2 0 01-1.414-.586L3 12z"/>
              </svg>
              1文字消す
            </button>
            <!-- ぜんぶ消す -->
            <button id="btn-clear-all" class="flex items-center gap-1 px-3 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold text-xs sm:text-sm shadow-sm active:translate-y-0.5 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
              ぜんぶ消す
            </button>
          </div>
        </div>
      </section>

      <!-- 2. 50音チップボード（伝統的50音順配列） -->
      <section class="flex-1 bg-white rounded-2xl p-2.5 sm:p-3 shadow-md border border-slate-200 flex flex-col overflow-hidden justify-between">
        
        <!-- 50音表（右から：あ行、か行、さ行…わ行 / 縦に：あ、い、う、え、お） -->
        <div class="flex-1 flex flex-col justify-center gap-2 overflow-y-auto">
          
          <div class="flex items-center justify-between mb-0.5 px-1">
            <span class="text-xs font-bold text-slate-500">50音表（あ行〜わ行）</span>
            <span class="text-[11px] text-sky-600 font-semibold">「゛」「゜」を押すと直前の文字に濁点がつきます</span>
          </div>

          <!-- グリッド：右からあ行〜わ行 -->
          <div id="grid-50on" class="gojuon-grid gap-1 sm:gap-2">
            <!-- JSで縦5行×横10列（伝統配置）を挿入 -->
          </div>

          <!-- 下段：小文字・伸ばす音・濁点半濁点 -->
          <div class="pt-2 border-t border-slate-200">
            <div class="text-xs font-bold text-slate-500 mb-1.5 px-1">小さい文字・記号・濁点変換</div>
            <div id="grid-special" class="flex flex-wrap items-center gap-2 justify-start">
              <!-- JSで「ゃ」「ゅ」「ょ」「っ」「ー」「゛」「゜」を挿入 -->
            </div>
          </div>

        </div>
      </section>
    </main>

    <!-- 右側：記録・履歴サイドパネル -->
    <aside id="history-panel" class="w-full md:w-80 bg-white border-l border-slate-200 shadow-xl md:shadow-none flex flex-col absolute md:relative inset-y-0 right-0 z-30 transform translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <h2 class="font-bold text-slate-800">作成した単語の記録</h2>
        </div>
        <button id="btn-close-history" class="md:hidden p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div id="history-list" class="flex-1 overflow-y-auto p-3 space-y-2.5">
        <div id="history-empty" class="text-center py-10 text-slate-400 text-sm">
          <svg class="w-12 h-12 mx-auto mb-2 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          単語を作成して<br>「きろくする」を押すと<br>ここに保存されます
        </div>
      </div>

      <div class="p-3 border-t border-slate-200 bg-slate-50 flex justify-between items-center text-xs text-slate-500">
        <span>※この端末のメモリにのみ保存</span>
        <button id="btn-clear-history" class="text-rose-600 hover:text-rose-700 font-semibold px-2 py-1 rounded hover:bg-rose-50 transition">
          履歴を消去
        </button>
      </div>
    </aside>

  </div>

  <!-- ドラッグ中追従用ゴーストエレメント -->
  <div id="drag-ghost" class="bg-sky-500 text-white font-bold rounded-2xl flex items-center justify-center border-2 border-white shadow-2xl">
    <span id="drag-ghost-text" class="text-2xl">あ</span>
  </div>

  <!-- JavaScript ロジック -->
  <script>
    // --- 伝統的50音表データ（右から「あ行」「か行」... 「わ行」） ---
    // 縦に「あ・い・う・え・お」で並べるため、列単位で定義（10列）
    const GOJUON_COLUMNS = [
      ["あ", "い", "う", "え", "お"], // あ行（右端）
      ["か", "き", "く", "け", "こ"], // か行
      ["さ", "し", "す", "せ", "そ"], // さ行
      ["た", "ち", "つ", "て", "と"], // た行
      ["な", "に", "ぬ", "ね", "の"], // な行
      ["は", "ひ", "ふ", "へ", "ほ"], // は行
      ["ま", "み", "む", "め", "も"], // ま行
      ["や", "",   "ゆ", "",   "よ"], // や行
      ["ら", "り", "る", "れ", "ろ"], // ら行
      ["わ", "",   "を", "",   "ん"]  // わ行（左端）
    ];

    // 特殊文字・記号・濁点（指定された小文字4種＋長音＋濁点＋半濁点）
    const SPECIAL_CHARS = [
      { char: "ゃ", type: "komoji" },
      { char: "ゅ", type: "komoji" },
      { char: "ょ", type: "komoji" },
      { char: "っ", type: "komoji" },
      { char: "ー", type: "symbol" },
      { char: "゛", type: "diacritic", sub: "濁点" },
      { char: "゜", type: "diacritic", sub: "半濁点" }
    ];

    // 濁点（゛）変換マップ
    const DAKUTEN_MAP = {
      'か': 'が', 'が': 'か', 'き': 'ぎ', 'ぎ': 'き', 'く': 'ぐ', 'ぐ': 'く', 'け': 'げ', 'げ': 'け', 'こ': 'ご', 'ご': 'こ',
      'さ': 'ざ', 'ざ': 'さ', 'し': 'じ', 'じ': 'し', 'す': 'ず', 'ず': 'す', 'せ': 'ぜ', 'ぜ': 'せ', 'そ': 'ぞ', 'ぞ': 'そ',
      'た': 'だ', 'だ': 'た', 'ち': 'ぢ', 'ぢ': 'ち', 'つ': 'づ', 'づ': 'つ', 'て': 'で', 'で': 'て', 'と': 'ど', 'ど': 'と',
      'は': 'ば', 'ば': 'は', 'ひ': 'び', 'び': 'ひ', 'ふ': 'ぶ', 'ぶ': 'ふ', 'へ': 'べ', 'べ': 'へ', 'ほ': 'ぼ', 'ぼ': 'ほ',
      'う': 'ゔ', 'ゔ': 'う', 'ぱ': 'ば'
    };

    // 半濁点（゜）変換マップ
    const HANDAKUTEN_MAP = {
      'は': 'ぱ', 'ぱ': 'は', 'ひ': 'ぴ', 'ぴ': 'ひ', 'ふ': 'ぷ', 'ぷ': 'ふ', 'へ': 'ぺ', 'ぺ': 'へ', 'ほ': 'ぽ', 'ぽ': 'ほ',
      'ば': 'ぱ'
    };

    // --- State ---
    let currentWord = []; // 解答スロット [{ id, char }]
    let savedHistory = [];
    let soundEnabled = true;
    let isLargeFont = true;
    let nextId = 1;

    let audioCtx = null;

    function playPopSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function playDeleteSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

    // DOM要素
    const slotContainer = document.getElementById('word-slot-container');
    const slotPlaceholder = document.getElementById('slot-placeholder');
    const wordCountLabel = document.getElementById('word-count-label');
    const dragGhost = document.getElementById('drag-ghost');
    const dragGhostText = document.getElementById('drag-ghost-text');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');
    const historyEmpty = document.getElementById('history-empty');
    const historyBadge = document.getElementById('history-badge');

    // チップボタン生成
    function createTileButton(item, bgStyle, borderStyle, textColor) {
      const char = typeof item === 'string' ? item : item.char;
      const btn = document.createElement('button');
      
      btn.className = `tile-btn flex flex-col items-center justify-center font-extrabold rounded-xl ${bgStyle} ${borderStyle} ${textColor} border-b-4 select-none touch-none cursor-pointer active:scale-95 transition-transform`;
      
      const sizeClass = isLargeFont 
        ? 'h-10 text-lg sm:h-12 sm:text-2xl' 
        : 'h-8 text-base sm:h-10 sm:text-xl';
      btn.className += ` ${sizeClass}`;

      btn.innerText = char;
      btn.setAttribute('data-char', char);

      setupBoardTilePointerEvents(btn, char);

      return btn;
    }

    // 50音盤（縦5段×横10列）および特殊キーの生成
    function renderBoardGrids() {
      const grid50on = document.getElementById('grid-50on');
      const gridSpecial = document.getElementById('grid-special');

      grid50on.innerHTML = '';
      gridSpecial.innerHTML = '';

      // 50音表（行ごとに5段描画）
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 10; col++) {
          const char = GOJUON_COLUMNS[col][row];
          if (char) {
            const btn = createTileButton(
              char,
              'bg-gradient-to-b from-sky-50 to-sky-100 border-sky-300 hover:bg-sky-200',
              'border-b-sky-400',
              'text-sky-950'
            );
            grid50on.appendChild(btn);
          } else {
            // 空白セル
            const emptyDiv = document.createElement('div');
            grid50on.appendChild(emptyDiv);
          }
        }
      }

      // 特殊キーエリア（小文字・伸ばす音・濁点半濁点）
      SPECIAL_CHARS.forEach(item => {
        let bgStyle = 'bg-gradient-to-b from-amber-50 to-amber-100 border-amber-300 hover:bg-amber-200';
        let borderStyle = 'border-b-amber-400';
        let textColor = 'text-amber-950';

        if (item.type === 'diacritic') {
          // 濁点・半濁点は目立つオレンジ・ローズカラー
          bgStyle = 'bg-gradient-to-b from-orange-100 to-orange-200 border-orange-400 hover:bg-orange-300';
          borderStyle = 'border-b-orange-500';
          textColor = 'text-orange-950 font-black';
        }

        const btn = document.createElement('button');
        btn.className = `tile-btn flex flex-col items-center justify-center font-extrabold rounded-xl ${bgStyle} ${borderStyle} ${textColor} border-b-4 select-none touch-none cursor-pointer active:scale-95 transition-transform`;
        
        const sizeClass = isLargeFont 
          ? 'w-12 h-11 text-xl sm:w-14 sm:h-13 sm:text-2xl' 
          : 'w-10 h-9 text-lg sm:w-12 sm:h-11 sm:text-xl';
        btn.className += ` ${sizeClass}`;

        btn.innerText = item.char;
        btn.setAttribute('data-char', item.char);

        setupBoardTilePointerEvents(btn, item.char);
        gridSpecial.appendChild(btn);
      });
    }

    // 解答スロットの描画
    function renderWordSlot() {
      if (currentWord.length === 0) {
        slotPlaceholder.style.display = 'flex';
      } else {
        slotPlaceholder.style.display = 'none';
      }

      Array.from(slotContainer.children).forEach(child => {
        if (child !== slotPlaceholder) {
          slotContainer.removeChild(child);
        }
      });

      wordCountLabel.innerText = `${currentWord.length} 文字`;

      currentWord.forEach((item, index) => {
        const tile = document.createElement('div');
        const tileSizeClass = isLargeFont 
          ? 'w-12 h-12 text-2xl sm:w-14 sm:h-14 sm:text-3xl' 
          : 'w-10 h-10 text-xl sm:w-12 sm:h-12 sm:text-2xl';

        tile.className = `slot-tile ${tileSizeClass} bg-sky-600 text-white font-black rounded-2xl flex items-center justify-center relative cursor-grab active:cursor-grabbing select-none border-2 border-sky-400 shadow-md group`;
        tile.setAttribute('data-id', item.id);
        tile.setAttribute('data-index', index);

        const span = document.createElement('span');
        span.innerText = item.char;
        tile.appendChild(span);

        // バツボタン
        const delBtn = document.createElement('button');
        delBtn.className = "absolute -top-1.5 -right-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow-md transition transform scale-90 sm:scale-100 opacity-90 sm:opacity-0 group-hover:opacity-100";
        delBtn.innerHTML = "&times;";
        delBtn.title = "この1文字を消す";
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeCharAtIndex(index);
        });
        tile.appendChild(delBtn);

        setupSlotTilePointerEvents(tile, index);
        slotContainer.appendChild(tile);
      });
    }

    // 文字追加・濁点トグル処理
    function appendChar(char) {
      if (char === "゛") {
        applyDiacritic(DAKUTEN_MAP);
        return;
      }
      if (char === "゜") {
        applyDiacritic(HANDAKUTEN_MAP);
        return;
      }

      currentWord.push({ id: nextId++, char: char });
      playPopSound();
      renderWordSlot();
      slotContainer.scrollLeft = slotContainer.scrollWidth;
    }

    // 濁点・半濁点の適用（直前の文字を変換）
    function applyDiacritic(map) {
      if (currentWord.length === 0) return;
      const lastIndex = currentWord.length - 1;
      const lastChar = currentWord[lastIndex].char;

      if (map[lastChar]) {
        currentWord[lastIndex].char = map[lastChar];
        playPopSound();
        renderWordSlot();
      }
    }

    function removeCharAtIndex(index) {
      if (index >= 0 && index < currentWord.length) {
        currentWord.splice(index, 1);
        playDeleteSound();
        renderWordSlot();
      }
    }

    function removeLastChar() {
      if (currentWord.length > 0) {
        currentWord.pop();
        playDeleteSound();
        renderWordSlot();
      }
    }

    function clearAllChars() {
      if (currentWord.length > 0) {
        currentWord = [];
        playDeleteSound();
        renderWordSlot();
      }
    }

    // 音声読み上げ
    function speakCurrentWord() {
      if (currentWord.length === 0) return;
      const textToSpeak = currentWord.map(item => item.char).join('');
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      } else {
        alert("お使いのブラウザは音声読み上げに対応していません。");
      }
    }

    // 履歴記録
    function saveCurrentWordToHistory() {
      if (currentWord.length === 0) return;
      const wordText = currentWord.map(item => item.char).join('');
      
      const newItem = {
        id: Date.now(),
        text: wordText,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      savedHistory.unshift(newItem);
      playPopSound();
      renderHistoryList();
    }

    function renderHistoryList() {
      historyList.innerHTML = '';
      if (savedHistory.length === 0) {
        historyList.appendChild(historyEmpty);
        historyBadge.classList.add('hidden');
        return;
      }

      historyEmpty.remove();
      historyBadge.innerText = savedHistory.length;
      historyBadge.classList.remove('hidden');

      savedHistory.forEach((item) => {
        const card = document.createElement('div');
        card.className = "p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between gap-2 shadow-sm hover:border-sky-300 transition";

        const textDiv = document.createElement('div');
        textDiv.className = "flex-1 overflow-hidden";
        textDiv.innerHTML = `
          <div class="text-lg font-black text-slate-800 tracking-wide break-all">${item.text}</div>
          <div class="text-[10px] font-semibold text-slate-400">${item.time}</div>
        `;

        const actionDiv = document.createElement('div');
        actionDiv.className = "flex items-center gap-1 shrink-0";

        const btnSpeak = document.createElement('button');
        btnSpeak.className = "p-1.5 text-emerald-600 hover:bg-emerald-50 rounded-lg transition";
        btnSpeak.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M11 5L6 9H2v6h4l5 4V5z"/></svg>`;
        btnSpeak.onclick = () => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(item.text);
            u.lang = 'ja-JP';
            u.rate = 0.85;
            window.speechSynthesis.speak(u);
          }
        };

        const btnLoad = document.createElement('button');
        btnLoad.className = "p-1.5 text-sky-600 hover:bg-sky-50 rounded-lg transition";
        btnLoad.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>`;
        btnLoad.onclick = () => {
          currentWord = item.text.split('').map(c => ({ id: nextId++, char: c }));
          playPopSound();
          renderWordSlot();
        };

        const btnDel = document.createElement('button');
        btnDel.className = "p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg transition";
        btnDel.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;
        btnDel.onclick = () => {
          savedHistory = savedHistory.filter(h => h.id !== item.id);
          playDeleteSound();
          renderHistoryList();
        };

        actionDiv.appendChild(btnSpeak);
        actionDiv.appendChild(btnLoad);
        actionDiv.appendChild(btnDel);

        card.appendChild(textDiv);
        card.appendChild(actionDiv);
        historyList.appendChild(card);
      });
    }

    // タップ・ドラッグイベント処理
    let activeDragState = null;

    function setupBoardTilePointerEvents(element, char) {
      let startX = 0, startY = 0;
      let isDragging = false;
      let pointerId = null;

      element.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        pointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        isDragging = false;

        element.classList.add('is-pressed');
        element.setPointerCapture(pointerId);
      });

      element.addEventListener('pointermove', (e) => {
        if (pointerId !== e.pointerId) return;
        const dist = Math.hypot(e.clientX - startX, e.clientY - startY);

        if (!isDragging && dist > 8) {
          isDragging = true;
          startGhostDrag(char, e.clientX, e.clientY, 'board');
        }

        if (isDragging && activeDragState) {
          updateGhostPosition(e.clientX, e.clientY);
        }
      });

      element.addEventListener('pointerup', (e) => {
        if (pointerId !== e.pointerId) return;
        element.classList.remove('is-pressed');
        try { element.releasePointerCapture(pointerId); } catch(err){}

        if (isDragging) {
          endGhostDrag(e.clientX, e.clientY);
        } else {
          appendChar(char);
        }
        pointerId = null;
        isDragging = false;
      });

      element.addEventListener('pointercancel', (e) => {
        element.classList.remove('is-pressed');
        if (isDragging) endGhostDrag(null, null);
        pointerId = null;
        isDragging = false;
      });
    }

    function setupSlotTilePointerEvents(element, index) {
      let startX = 0, startY = 0;
      let isDragging = false;
      let pointerId = null;
      const char = currentWord[index].char;

      element.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        pointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        isDragging = false;

        element.setPointerCapture(pointerId);
      });

      element.addEventListener('pointermove', (e) => {
        if (pointerId !== e.pointerId) return;
        const dist = Math.hypot(e.clientX - startX, e.clientY - startY);

        if (!isDragging && dist > 8) {
          isDragging = true;
          element.classList.add('dragging');
          startGhostDrag(char, e.clientX, e.clientY, 'slot', index);
        }

        if (isDragging && activeDragState) {
          updateGhostPosition(e.clientX, e.clientY);
        }
      });

      element.addEventListener('pointerup', (e) => {
        if (pointerId !== e.pointerId) return;
        element.classList.remove('dragging');
        try { element.releasePointerCapture(pointerId); } catch(err){}

        if (isDragging) {
          endGhostDrag(e.clientX, e.clientY);
        }
        pointerId = null;
        isDragging = false;
      });

      element.addEventListener('pointercancel', (e) => {
        element.classList.remove('dragging');
        if (isDragging) endGhostDrag(null, null);
        pointerId = null;
        isDragging = false;
      });
    }

    function startGhostDrag(char, x, y, sourceType, fromIndex = -1) {
      activeDragState = { char, sourceType, fromIndex };
      dragGhostText.innerText = char;
      dragGhost.style.width = isLargeFont ? '56px' : '48px';
      dragGhost.style.height = isLargeFont ? '56px' : '48px';
      dragGhost.style.display = 'flex';
      updateGhostPosition(x, y);

      slotContainer.classList.add('bg-sky-50', 'border-sky-400');
    }

    function updateGhostPosition(x, y) {
      dragGhost.style.left = `${x}px`;
      dragGhost.style.top = `${y}px`;
    }

    function endGhostDrag(x, y) {
      dragGhost.style.display = 'none';
      slotContainer.classList.remove('bg-sky-50', 'border-sky-400');

      if (!activeDragState || x === null || y === null) {
        activeDragState = null;
        return;
      }

      const rect = slotContainer.getBoundingClientRect();
      const isInside = (
        x >= rect.left - 20 &&
        x <= rect.right + 20 &&
        y >= rect.top - 20 &&
        y <= rect.bottom + 20
      );

      if (isInside) {
        const targetIndex = calculateInsertIndex(x);

        if (activeDragState.sourceType === 'board') {
          if (activeDragState.char === "゛") {
            applyDiacritic(DAKUTEN_MAP);
          } else if (activeDragState.char === "゜") {
            applyDiacritic(HANDAKUTEN_MAP);
          } else {
            currentWord.splice(targetIndex, 0, { id: nextId++, char: activeDragState.char });
            playPopSound();
          }
        } else if (activeDragState.sourceType === 'slot') {
          const fromIdx = activeDragState.fromIndex;
          if (fromIdx !== -1) {
            const item = currentWord.splice(fromIdx, 1)[0];
            const adjustedIdx = targetIndex > fromIdx ? targetIndex - 1 : targetIndex;
            currentWord.splice(adjustedIdx, 0, item);
            playPopSound();
          }
        }
        renderWordSlot();
      }

      activeDragState = null;
    }

    function calculateInsertIndex(clientX) {
      const tiles = Array.from(slotContainer.querySelectorAll('.slot-tile'));
      if (tiles.length === 0) return 0;

      for (let i = 0; i < tiles.length; i++) {
        const box = tiles[i].getBoundingClientRect();
        const midX = box.left + box.width / 2;
        if (clientX < midX) return i;
      }
      return tiles.length;
    }

    // コントロールボタン設定
    document.getElementById('btn-speak').addEventListener('click', speakCurrentWord);
    document.getElementById('btn-save-word').addEventListener('click', saveCurrentWordToHistory);
    document.getElementById('btn-backspace').addEventListener('click', removeLastChar);
    document.getElementById('btn-clear-all').addEventListener('click', clearAllChars);

    document.getElementById('btn-sound-toggle').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('icon-sound-on').classList.toggle('hidden', !soundEnabled);
      document.getElementById('icon-sound-off').classList.toggle('hidden', soundEnabled);
    });

    document.getElementById('btn-font-size').addEventListener('click', () => {
      isLargeFont = !isLargeFont;
      document.getElementById('label-font-size').innerText = isLargeFont ? '文字:大' : '文字:標準';
      renderBoardGrids();
      renderWordSlot();
    });

    const historyPanelElem = document.getElementById('history-panel');
    document.getElementById('btn-toggle-history').addEventListener('click', () => {
      historyPanelElem.classList.toggle('translate-x-full');
    });
    document.getElementById('btn-close-history').addEventListener('click', () => {
      historyPanelElem.classList.toggle('translate-x-full');
    });

    document.getElementById('btn-clear-history').addEventListener('click', () => {
      if (savedHistory.length === 0) return;
      savedHistory = [];
      playDeleteSound();
      renderHistoryList();
    });

    window.onload = () => {
      renderBoardGrids();
      renderWordSlot();
      renderHistoryList();
    };
  </script>
</body>
</html>
