<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>50音チップ単語作成アプリ（リハビリ支援）</title>
<style>
  :root {
    --bg-main: #f4f7fb;
    --card-bg: #ffffff;
    --border-color: #cbd5e1;
    --text-main: #0f172a;
    --text-sub: #475569;
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --seion-bg: #e0f2fe;
    --seion-border: #7dd3fc;
    --komoji-bg: #ffedd5;
    --komoji-border: #fdba74;
    --daku-bg: #dcfce7;
    --daku-border: #86efac;
    --chip-size: 52px;
    --chip-font: 22px;
    --slot-size: 62px;
    --slot-font: 28px;
  }

  body.large-text {
    --chip-size: 64px;
    --chip-font: 26px;
    --slot-size: 74px;
    --slot-font: 34px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    min-height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .app-title {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-main);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    transition: background-color 0.15s, transform 0.08s;
    touch-action: manipulation;
  }

  button:active {
    transform: scale(0.97);
  }

  button.primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  button.active-toggle {
    background: #e0f2fe;
    border-color: #0284c7;
    color: #0369a1;
  }

  .main-container {
    display: flex;
    gap: 14px;
    padding: 14px;
    max-width: 1440px;
    margin: 0 auto;
    align-items: flex-start;
  }

  .workspace {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
  }

  .panel-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .panel-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-sub);
  }

  .word-area {
    min-height: 92px;
    max-height: 220px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border: 2px dashed #94a3b8;
    border-radius: 12px;
    padding: 10px;
    background: #f8fafc;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    touch-action: pan-y;
  }

  .word-placeholder {
    color: #94a3b8;
    font-size: 15px;
    padding: 8px;
  }

  .word-slot {
    width: var(--slot-size);
    height: var(--slot-size);
    border-radius: 12px;
    background: #ffffff;
    border: 2px solid #38bdf8;
    box-shadow: 0 2px 4px rgba(2, 132, 199, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--slot-font);
    font-weight: 700;
    cursor: grab;
    user-select: none;
    touch-action: none;
    position: relative;
  }

  .word-slot.selected {
    outline: 3px solid #f59e0b;
    background: #fffbeb;
  }

  .action-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  button.danger {
    background: #fef2f2;
    border-color: #fca5a5;
    color: #b91c1c;
  }

  button.success {
    background: #f0fdf4;
    border-color: #86efac;
    color: #15803d;
  }

  .board-scroll-area {
    max-height: 62vh;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 12px;
    touch-action: pan-x pan-y;
  }

  .gojuon-grid {
    display: inline-flex;
    flex-direction: row-reverse;
    gap: 6px;
    min-width: max-content;
    padding: 4px;
  }

  .gojuon-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .chip-btn {
    width: var(--chip-size);
    height: var(--chip-size);
    border-radius: 10px;
    font-size: var(--chip-font);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    user-select: none;
    touch-action: pan-x pan-y;
  }

  .chip-seion {
    background: var(--seion-bg);
    border-color: var(--seion-border);
  }

  .chip-komoji {
    background: var(--komoji-bg);
    border-color: var(--komoji-border);
  }

  .chip-daku {
    background: var(--daku-bg);
    border-color: var(--daku-border);
  }

  .chip-spacer {
    width: var(--chip-size);
    height: var(--chip-size);
    visibility: hidden;
  }

  .mod-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
  }

  .history-panel {
    width: 280px;
    flex: 0 0 280px;
    max-height: 82vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }

  .history-panel.hidden {
    display: none;
  }

  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 16px;
    font-weight: 700;
  }

  .history-actions {
    display: flex;
    gap: 4px;
  }

  .history-actions button {
    padding: 4px 8px;
    font-size: 12px;
  }

  @media (max-width: 900px) {
    .main-container {
      flex-direction: column;
    }
    .history-panel {
      width: 100%;
      flex: none;
      max-height: 260px;
    }
  }
</style>
</head>
<body>
<header>
  <div class="app-title">50音チップ単語作成アプリ</div>
  <div class="toolbar">
    <button id="toggleTextSizeBtn" type="button">文字: 大</button>
    <button id="toggleSoundBtn" type="button" class="active-toggle">効果音: オン</button>
    <button id="toggleHistoryBtn" type="button" class="active-toggle">履歴を隠す</button>
  </div>
</header>

<div class="main-container">
  <main class="workspace">
    <section class="panel">
      <div class="panel-header">
        <span class="panel-title">作成した単語（タップで選択・ドラッグで並べ替え）</span>
        <span id="charCountLabel" class="panel-title">0文字</span>
      </div>
      <div id="wordArea" class="word-area" aria-label="単語作成エリア">
        <span id="wordPlaceholder" class="word-placeholder">下の50音チップを押して文字を並べてください</span>
      </div>
      <div class="action-bar">
        <button id="speakBtn" type="button" class="primary">よみあげる</button>
        <button id="saveWordBtn" type="button" class="success">履歴に記録</button>
        <button id="backspaceBtn" type="button">1文字消す</button>
        <button id="clearBtn" type="button" class="danger">全部消す</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <span class="panel-title">50音ボード（右から「あ行〜わ行」）</span>
      </div>
      <div id="boardScrollArea" class="board-scroll-area">
        <div id="gojuonGrid" class="gojuon-grid"></div>
      </div>

      <div class="mod-row">
        <button id="dakuBtn" type="button" class="chip-btn chip-daku" title="濁点をつける・外す">゛</button>
        <button id="handakuBtn" type="button" class="chip-btn chip-daku" title="半濁点をつける・外す">゜</button>
        <button type="button" class="chip-btn chip-komoji" data-char="ゃ">ゃ</button>
        <button type="button" class="chip-btn chip-komoji" data-char="ゅ">ゅ</button>
        <button type="button" class="chip-btn chip-komoji" data-char="ょ">ょ</button>
        <button type="button" class="chip-btn chip-komoji" data-char="っ">っ</button>
        <button type="button" class="chip-btn chip-seion" data-char="ー">ー</button>
      </div>
    </section>
  </main>

  <aside id="historyPanel" class="panel history-panel">
    <div class="panel-header">
      <span class="panel-title">記録した単語</span>
      <button id="clearHistoryBtn" type="button">履歴クリア</button>
    </div>
    <ul id="historyList" class="history-list"></ul>
  </aside>
</div>

<script>
  const COLUMNS = [
    ["わ", "を", "ん", "", ""],
    ["ら", "り", "る", "れ", "ろ"],
    ["や", "", "ゆ", "", "よ"],
    ["ま", "み", "む", "め", "も"],
    ["は", "ひ", "ふ", "へ", "ほ"],
    ["な", "に", "ぬ", "ね", "の"],
    ["た", "ち", "つ", "て", "と"],
    ["さ", "し", "す", "せ", "そ"],
    ["か", "き", "く", "け", "こ"],
    ["あ", "い", "う", "え", "お"]
  ];

  const DAKU_MAP = {
    "か": "が", "き": "ぎ", "く": "ぐ", "け": "げ", "こ": "ご",
    "さ": "ざ", "し": "じ", "す": "ず", "せ": "ぜ", "そ": "ぞ",
    "た": "だ", "ち": "ぢ", "つ": "づ", "て": "で", "と": "ど",
    "は": "ば", "ひ": "び", "ふ": "ぶ", "へ": "べ", "ほ": "ぼ",
    "う": "ゔ",
    "が": "か", "ぎ": "き", "ぐ": "く", "げ": "け", "ご": "こ",
    "ざ": "さ", "じ": "し", "ず": "す", "ぜ": "せ", "ぞ": "そ",
    "だ": "た", "ぢ": "ち", "づ": "つ", "で": "て", "ど": "と",
    "ば": "は", "び": "ひ", "ぶ": "ふ", "べ": "へ", "ぼ": "ほ",
    "ゔ": "う"
  };

  const HANDAKU_MAP = {
    "は": "ぱ", "ひ": "ぴ", "ふ": "ぷ", "へ": "ぺ", "ほ": "ぽ",
    "ぱ": "は", "ぴ": "ひ", "ぷ": "ふ", "ぺ": "へ", "ぽ": "ほ"
  };

  let chars = [];
  let selectedIndex = null;
  let soundEnabled = true;
  let historyVisible = true;
  let historyWords = [];
  let audioCtx = null;

  const wordArea = document.getElementById("wordArea");
  const wordPlaceholder = document.getElementById("wordPlaceholder");
  const charCountLabel = document.getElementById("charCountLabel");
  const gojuonGrid = document.getElementById("gojuonGrid");
  const historyPanel = document.getElementById("historyPanel");
  const historyList = document.getElementById("historyList");

  function playTone(freq = 520, duration = 0.08) {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function speakText(text) {
    if (!text || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "ja-JP";
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  function addChar(ch) {
    if (!ch) return;
    if (selectedIndex !== null && selectedIndex >= 0 && selectedIndex < chars.length) {
      chars.splice(selectedIndex + 1, 0, ch);
      selectedIndex += 1;
    } else {
      chars.push(ch);
      selectedIndex = chars.length - 1;
    }
    playTone(580);
    renderWordArea();
  }

  function applyDiacritic(mapObj) {
    if (chars.length === 0) return;
    const targetIdx = (selectedIndex !== null && selectedIndex >= 0 && selectedIndex < chars.length)
      ? selectedIndex
      : chars.length - 1;
    const current = chars[targetIdx];
    if (mapObj[current]) {
      chars[targetIdx] = mapObj[current];
      playTone(660);
      renderWordArea();
    }
  }

  function renderWordArea() {
    Array.from(wordArea.querySelectorAll(".word-slot")).forEach(el => el.remove());
    charCountLabel.textContent = `${chars.length}文字`;

    if (chars.length === 0) {
      wordPlaceholder.style.display = "inline";
      selectedIndex = null;
      return;
    }
    wordPlaceholder.style.display = "none";

    chars.forEach((ch, idx) => {
      const slot = document.createElement("div");
      slot.className = "word-slot" + (idx === selectedIndex ? " selected" : "");
      slot.textContent = ch;
      slot.dataset.index = idx;

      slot.addEventListener("click", (e) => {
        e.stopPropagation();
        selectedIndex = idx;
        playTone(480, 0.05);
        renderWordArea();
      });

      let dragging = false;
      let startX = 0;
      let startY = 0;

      slot.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        startX = e.clientX;
        startY = e.clientY;
        dragging = false;
      });

      slot.addEventListener("pointermove", (e) => {
        if (e.pointerType === "mouse" && !(e.buttons & 1)) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!dragging && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
          dragging = true;
          slot.setPointerCapture(e.pointerId);
          slot.style.opacity = "0.75";
        }
        if (dragging) {
          slot.style.transform = `translate(${dx}px, ${dy}px)`;
        }
      });

      const finishDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        slot.style.opacity = "";
        slot.style.transform = "";
        try {
          slot.releasePointerCapture(e.pointerId);
        } catch (err) {}

        const slots = Array.from(wordArea.querySelectorAll(".word-slot"));
        let targetIdx = idx;
        slots.forEach((other, oIdx) => {
          const rect = other.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          if (e.clientX > centerX && oIdx > idx) {
            targetIdx = oIdx;
          } else if (e.clientX < centerX && oIdx < idx && targetIdx === idx) {
            targetIdx = oIdx;
          }
        });

        if (targetIdx !== idx) {
          const [moved] = chars.splice(idx, 1);
          chars.splice(targetIdx, 0, moved);
          selectedIndex = targetIdx;
          playTone(540);
          renderWordArea();
        }
      };

      slot.addEventListener("pointerup", finishDrag);
      slot.addEventListener("pointercancel", finishDrag);

      wordArea.appendChild(slot);
    });
  }

  function renderBoard() {
    gojuonGrid.innerHTML = "";
    COLUMNS.forEach(colChars => {
      const colEl = document.createElement("div");
      colEl.className = "gojuon-col";
      colChars.forEach(ch => {
        if (!ch) {
          const spacer = document.createElement("div");
          spacer.className = "chip-spacer";
          colEl.appendChild(spacer);
          return;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip-btn chip-seion";
        btn.textContent = ch;
        btn.addEventListener("click", () => addChar(ch));
        colEl.appendChild(btn);
      });
      gojuonGrid.appendChild(colEl);
    });
  }

  function renderHistory() {
    historyList.innerHTML = "";
    if (historyWords.length === 0) {
      const li = document.createElement("li");
      li.className = "word-placeholder";
      li.textContent = "まだ記録はありません";
      historyList.appendChild(li);
      return;
    }

    historyWords.forEach((word, i) => {
      const li = document.createElement("li");
      li.className = "history-item";

      const span = document.createElement("span");
      span.textContent = word;

      const actions = document.createElement("div");
      actions.className = "history-actions";

      const sayBtn = document.createElement("button");
      sayBtn.type = "button";
      sayBtn.textContent = "音声";
      sayBtn.addEventListener("click", () => speakText(word));

      const loadBtn = document.createElement("button");
      loadBtn.type = "button";
      loadBtn.textContent = "呼出";
      loadBtn.addEventListener("click", () => {
        chars = Array.from(word);
        selectedIndex = chars.length > 0 ? chars.length - 1 : null;
        renderWordArea();
      });

      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click", () => {
        historyWords.splice(i, 1);
        renderHistory();
      });

      actions.appendChild(sayBtn);
      actions.appendChild(loadBtn);
      actions.appendChild(delBtn);

      li.appendChild(span);
      li.appendChild(actions);
      historyList.appendChild(li);
    });
  }

  document.querySelectorAll(".mod-row button[data-char]").forEach(btn => {
    btn.addEventListener("click", () => addChar(btn.dataset.char));
  });

  document.getElementById("dakuBtn").addEventListener("click", () => applyDiacritic(DAKU_MAP));
  document.getElementById("handakuBtn").addEventListener("click", () => applyDiacritic(HANDAKU_MAP));

  document.getElementById("speakBtn").addEventListener("click", () => {
    const word = chars.join("");
    if (word) speakText(word);
  });

  document.getElementById("saveWordBtn").addEventListener("click", () => {
    const word = chars.join("");
    if (!word) return;
    historyWords.unshift(word);
    playTone(720, 0.1);
    renderHistory();
  });

  document.getElementById("backspaceBtn").addEventListener("click", () => {
    if (chars.length === 0) return;
    const removeIdx = (selectedIndex !== null && selectedIndex >= 0 && selectedIndex < chars.length)
      ? selectedIndex
      : chars.length - 1;
    chars.splice(removeIdx, 1);
    selectedIndex = chars.length > 0 ? Math.min(removeIdx, chars.length - 1) : null;
    playTone(400, 0.06);
    renderWordArea();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    chars = [];
    selectedIndex = null;
    playTone(340, 0.08);
    renderWordArea();
  });

  document.getElementById("clearHistoryBtn").addEventListener("click", () => {
    historyWords = [];
    renderHistory();
  });

  const toggleTextSizeBtn = document.getElementById("toggleTextSizeBtn");
  toggleTextSizeBtn.addEventListener("click", () => {
    document.body.classList.toggle("large-text");
    const isLarge = document.body.classList.contains("large-text");
    toggleTextSizeBtn.textContent = isLarge ? "文字: 標準" : "文字: 大";
    toggleTextSizeBtn.classList.toggle("active-toggle", isLarge);
  });

  const toggleSoundBtn = document.getElementById("toggleSoundBtn");
  toggleSoundBtn.addEventListener("click", () => {
    soundEnabled = !soundEnabled;
    toggleSoundBtn.textContent = soundEnabled ? "効果音: オン" : "効果音: オフ";
    toggleSoundBtn.classList.toggle("active-toggle", soundEnabled);
  });

  const toggleHistoryBtn = document.getElementById("toggleHistoryBtn");
  toggleHistoryBtn.addEventListener("click", () => {
    historyVisible = !historyVisible;
    historyPanel.classList.toggle("hidden", !historyVisible);
    toggleHistoryBtn.textContent = historyVisible ? "履歴を隠す" : "履歴を表示";
    toggleHistoryBtn.classList.toggle("active-toggle", historyVisible);
  });

  renderBoard();
  renderWordArea();
  renderHistory();
</script>
</body>
</html>
